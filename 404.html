<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening The Marr Atlas…</title>
    <script>
      (() => {
        const basePath = "/Marr-interactive/";
        const requestedPath = `${window.location.pathname}${window.location.search}${window.location.hash}`;
        if (window.location.pathname.startsWith(basePath)) {
          sessionStorage.setItem("marr-atlas-deep-link", requestedPath);
        }
        window.location.replace(basePath);
      })();
    </script>
  </head>
  <body>
    <p>Opening <a href="/Marr-interactive/">The Marr Atlas</a>…</p>
  </body>
</html>
